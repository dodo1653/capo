<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>$CAPO</title>
  <meta name="description" content="A capy in a pink bandana, an endless getaway sprint, and a gallery of questionable decisions." />
  <meta property="og:title" content="$CAPO" />
  <meta property="og:description" content="A capy in a pink bandana, an endless getaway sprint, and a gallery of questionable decisions." />
  <meta property="og:image" content="https://pbs.twimg.com/profile_images/2089351390443290624/EkIUlIhD_400x400.jpg" />
  <meta property="og:image:width" content="400" />
  <meta property="og:image:height" content="400" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="$CAPO" />
  <meta name="twitter:description" content="A capy in a pink bandana, an endless getaway sprint, and a gallery of questionable decisions." />
  <meta name="twitter:image" content="https://pbs.twimg.com/profile_images/2089351390443290624/EkIUlIhD_400x400.jpg" />
  <link rel="icon" href="/media/icon.jpg" type="image/jpeg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- endless run stage -->
  <div id="stage">
    <video id="heroA" class="hero on" src="media/hero.mp4" muted playsinline preload="auto"></video>
    <video id="heroB" class="hero" src="media/hero.mp4" muted playsinline preload="auto"></video>
  </div>

  <!-- cinematic bars + crt -->
  <div id="cine"><div class="bar top"></div><div class="bar bot"></div></div>
  <div id="crt"><i class="scan"></i><i class="vig"></i></div>

  <!-- hud -->
  <div id="hud">
    <div class="stack">
      <span class="ticker">$CAPO</span>
      <span class="hdr">Socials</span>
      <div class="social">
        <a class="ico" href="https://x.com/capopfun" target="_blank" rel="noopener" title="X" aria-label="X">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M14.234 10.162 22.977 0h-2.072l-7.591 8.824L7.251 0H.258l9.168 13.343L.258 24H2.33l8.016-9.318L16.749 24h6.993zm-2.837 3.299-.929-1.329L3.076 1.56h3.182l5.965 8.532.929 1.329 7.754 11.09h-3.182z"/></svg>
        </a>
        <a class="ico pending" id="ico-comm" title="Community — soon" aria-disabled="true">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="9" cy="7.4" r="3.7"/><path d="M2.4 20.4c0-3.7 3-6.2 6.6-6.2s6.6 2.5 6.6 6.2z"/><circle cx="17.4" cy="8.4" r="2.9"/><path d="M15 13.6c3.4-.9 6.6 1.2 6.6 4.6v2.2H18c0-2.7-1.1-5-3-6.8z"/></svg>
        </a>
        <a class="ico pending" id="ico-chart" title="Chart — soon" aria-disabled="true">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4 4v15a1 1 0 0 0 1 1h15v-2H6V4z"/><rect x="8" y="12" width="2.6" height="5"/><rect x="12.2" y="8" width="2.6" height="9"/><rect x="16.4" y="10.5" width="2.6" height="6.5"/><path d="M8.6 9.8l3.9-3 3.2 1.9 3.6-3.4 1.2 1.3-4.6 4.3-3.2-1.9-3 2.3z"/></svg>
        </a>
        <a class="ico pending" id="ico-buy" title="Buy — soon" aria-disabled="true">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4.4 8h15.2l-1.3 12.6H5.7z"/><path d="M8.4 9V6.6a3.6 3.6 0 017.2 0V9" fill="none" stroke="currentColor" stroke-width="1.9"/></svg>
        </a>
      </div>
      <div class="addr" id="addr">
        <div class="wbar"><span>contract</span></div>
        <div class="body"><span class="ca soon" id="ca">Stay Tuned</span></div>
      </div>
    </div>
    <button class="grp memesbtn" id="memesbtn" type="button"><b>Memes</b></button>
  </div>

  <!-- sound -->
  <div class="soundbar muted" id="soundbar">
    <button class="soundbtn" id="soundbtn" type="button" aria-pressed="false"><b>Sound Off</b></button>
    <div class="volwrap"><input class="vol" id="vol" type="range" min="0" max="1" step="0.01" value="0.7" aria-label="Volume" /></div>
  </div>

  <!-- memes window -->
  <div id="memes" class="sheet" hidden>
    <div class="win">
      <div class="tbar">
        <span class="tt">MEMES</span>
        <span class="btns"><i>_</i><i>&#9633;</i><b id="memesclose">&#10005;</b></span>
      </div>
      <div id="memegrid"></div>
    </div>
  </div>

  <!-- lightbox -->
  <div id="light" hidden>
    <img id="lightimg" alt="" />
    <button class="x close" id="lightclose" type="button">Close</button>
    <button class="x nav prev" id="lightprev" type="button">&#8249;</button>
    <button class="x nav next" id="lightnext" type="button">&#8250;</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
